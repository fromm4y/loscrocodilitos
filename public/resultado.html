<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resultado - Exploração do Oceano</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Ajustes específicos da página */
    main {
      text-align: center;
      padding: 3rem 1rem;
    }

    .emocao-card {
      display: inline-block;
      background: #b2dfdb;
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      margin-top: 1.5rem;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    body.dark .emocao-card {
      background: #004d40;
    }

    .emocao-card:hover {
      transform: translateY(-5px);
    }

    .emocao-card img {
      max-width: 350px;
      border-radius: 12px;
      display: block;
      margin: 0 auto 20px auto;
    }

    .voltar-btn {
      display: inline-block;
      padding: 0.8rem 1.5rem;
      background: #00796b;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      text-decoration: none;
    }

    .voltar-btn:hover {
      background: #004d40;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌊 Emoção Detectada</h1>
    <p class="slogan">Mergulhando nas emoções do oceano</p>
  </header>

  <main>
    <h2 id="emocaoTitle">Processando...</h2>
    <p id="confTitle"></p>

    <div class="emocao-card">
      <img id="imagemEmocao" alt="Imagem relacionada à emoção" />
      <br />
      <a href="index.html" class="voltar-btn">Voltar</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Exploração do Oceano | Projeto Educacional</p>
  </footer>

  <script>
    const imagensPorEmocao = {
        feliz: [
        'static/mar_feliz/1.png',
        'static/mar_feliz/2.png',
        'static/mar_feliz/3.png',
        'static/mar_feliz/4.png',
        'static/mar_feliz/5.png',
        'static/mar_feliz/6.png',
        'static/mar_feliz/7.png',
        'static/mar_feliz/8.png',
        'static/mar_feliz/9.png',
        'static/mar_feliz/10.png',
        'static/mar_feliz/11.png',
        'static/mar_feliz/12.png',
        'static/mar_feliz/13.png',
        'static/mar_feliz/14.png',
        'static/mar_feliz/15.png',
        'static/mar_feliz/16.png',
        'static/mar_feliz/17.png',
        'static/mar_feliz/18.png',
        'static/mar_feliz/19.png',
        'static/mar_feliz/20.png'
   ],
      triste: [
        'static/mar_triste/1.png',
        'static/mar_triste/2.png',
        'static/mar_triste/3.png',
        'static/mar_triste/4.png',
        'static/mar_triste/5.png',
        'static/mar_triste/6.png',
        'static/mar_triste/7.png',
        'static/mar_triste/8.png',
        'static/mar_triste/9.png',
        'static/mar_triste/10.png',
        'static/mar_triste/11.png',
        'static/mar_triste/12.png',
        'static/mar_triste/13.png',
        'static/mar_triste/14.png',
        'static/mar_triste/15.png',
        'static/mar_triste/16.png',
        'static/mar_triste/17.png',
        'static/mar_triste/18.png',
        'static/mar_triste/19.png',
        'static/mar_triste/20.png'
    
      ],
      neutro: [
        'static/mar_neutro/1.png',
        'static/mar_neutro/2.png',
        'static/mar_neutro/3.png',
        'static/mar_neutro/4.png',
        'static/mar_neutro/5.png',
        'static/mar_neutro/6.png',
        'static/mar_neutro/7.png',
        'static/mar_neutro/8.png',
        'static/mar_neutro/9.png',
        'static/mar_neutro/10.png',
        'static/mar_neutro/11.png',
        'static/mar_neutro/12.png',
        'static/mar_neutro/13.png',
        'static/mar_neutro/14.png',
        'static/mar_neutro/15.png',
        'static/mar_neutro/16.png',
        'static/mar_neutro/17.png',
        'static/mar_neutro/18.png',
        'static/mar_neutro/19.png',
        'static/mar_neutro/20.png'
      ]
    };

    const traducoes = {
      happy: 'feliz',
      sad: 'triste',
      neutral: 'neutro',
      angry: 'triste',
      fearful: 'triste',
      disgusted: 'triste',
      surprised: 'feliz'
    };

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function imagemAleatoria(lista) {
      return lista[Math.floor(Math.random() * lista.length)];
    }

    const emocaoOriginal = getQueryParam('emocao') || 'neutral';
    const conf = getQueryParam('conf') || '0';
    const emocaoTraduzida = traducoes[emocaoOriginal] || 'nenhuma';

    document.getElementById('emocaoTitle').innerText =
      emocaoTraduzida.charAt(0).toUpperCase() + emocaoTraduzida.slice(1);

    document.getElementById('confTitle').innerText = `Confiança: ${conf}%`;

    if (imagensPorEmocao[emocaoTraduzida] && imagensPorEmocao[emocaoTraduzida].length > 0) {
      document.getElementById('imagemEmocao').src = imagemAleatoria(imagensPorEmocao[emocaoTraduzida]);
    } else {
      document.getElementById('imagemEmocao').style.display = 'none';
    }
  </script>
</body>
</html>
